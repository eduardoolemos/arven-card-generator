version: '3.8'

services:
  arven-card-generator:
    image: python:3.11-slim
    ports:
      - "5000:5000"
    command: >
      bash -c "
        pip install flask pillow requests &&
        cd /tmp &&
        git clone https://github.com/eduardoolemos/arven-card-generator.git app &&
        cd app &&
        python app.py
      "
