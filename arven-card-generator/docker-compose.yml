version: '3.8'

services:
  arven-card-generator:
    build: .
    container_name: arven-card-generator
    ports:
      - "5000:5000"
    volumes:
      # Monte seus assets locais (logo, fontes)
      - ./fonts:/app/fonts
      - ./assets:/app/assets
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
